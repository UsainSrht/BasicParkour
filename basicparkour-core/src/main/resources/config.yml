# ─────────────────────────────────────────────────────────────────────────────
# Basic Parkour Plugin — Global Configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# QUICK PRESET GUIDE:
# 
# [Profile A: Server Feature (DEFAULT)]
#   Best for: SMP, Skyblock, Factions, Survival, Towny, Hub/Lobby minigame.
#   • Players see each other normally (visibility.default: ALL).
#   • Full player protection (zero fall damage, no inventory drop, no hunger drain).
#   • Anti-cheat enabled (disables /fly, Elytra gliding, Ender Pearls, /home, /tp).
#   • Clean exit: /pk leave teleports players back to where they started.
#   • TAB nametags/prefixes from other plugins are untouched (pause-team-handling: false).
#   • Ghost replays and hotbar items disabled by default for clean survival gameplay.
#
# [Profile B: Dedicated Parkour Server Setup]
#   To transform into a full, dedicated Parkour network/sub-server:
#   1. Set `hotbar-items.enabled: true` (gives players Restart, Checkpoint, Visibility, Leave items).
#   2. Set `visibility.default: TRANSLUCENT` or `NONE` (prevents 50 players blocking view on 1 block).
#   3. Set `ghost.enabled: true` and `ghost.playback.enabled: true` (enables 20fps ghost replay bots).
#   4. Set `tab.pause-team-handling: true` (prioritizes parkour translucent teams).
#   5. Optional: Set `restrictions.force-gamemode: ADVENTURE`.
# ─────────────────────────────────────────────────────────────────────────────

# Storage backend.
# Options: memory | sqlite | mysql
storage:
  type: sqlite

  # MySQL / PostgreSQL connection settings (only used when type: mysql)
  mysql:
    host: localhost
    port: 3306
    database: basicparkour
    username: root
    password: ""
    # HikariCP pool size (recommend 5-10 for most servers)
    pool-size: 10

# ─── Visibility & Isolation ───────────────────────────────────────────────────
# Spectators (players NOT in parkour) can always see players doing parkour and their generated blocks.
# Players IN parkour will NOT see other players doing parkour or blocks from other parkour courses
# at the same location (packets are isolated so you only see your own course!).
#
# Paper Vanish API Compatibility:
# Vanished staff are checked with player.canSee(other). BasicParkour will NEVER reveal or un-vanish
# staff members.
visibility:
  # Default visibility mode for players in active parkour sessions.
  # Options:
  #   NONE        - Player in parkour sees NO ONE (all players hidden from their view).
  #                 Spectators outside parkour CAN still see them doing the parkour!
  #                 Collision is fully disabled. Recommended for spawn parkour!
  #   ALL         - Players see everyone normally (isolated from other parkour runners on the same course).
  #   TRANSLUCENT - Other players appear as semi-transparent ghosts via scoreboard teams and invisibility.
  # Note: Players can also cycle their visibility with /pk visibility or the hotbar item.
  default: ALL

# ─── Session & Teleportation ──────────────────────────────────────────────────
session:
  # When true, typing /basicparkour leave teleports the player back to their exact location
  # where they were before starting the course. Essential for SMP/Skyblock!
  teleport-on-leave: true

  # What happens when a player FAILS (void, kill block, blocklist...). Independent from on-complete.
  # Options: COURSE | CHECKPOINT | JOIN_LOCATION
  #   COURSE        - Follow each course's own `die-mode` (RESTART_DIE / FAIL_DIE). Generated runs use RESTART_DIE.
  #   CHECKPOINT    - Always respawn at the last checkpoint and keep the run going.
  #   JOIN_LOCATION - Fail ends the run and teleports the player back to where they started.
  on-fail: COURSE

  # Where to teleport players when they complete a course.
  # Options: NONE | JOIN_LOCATION | START_LOCATION
  #   NONE           - Player stays at the finish line / end platform.
  #   JOIN_LOCATION  - Teleports player back to where they originally joined from.
  #   START_LOCATION - Teleports player back to the course start.
  teleport-on-complete: NONE

  # Optional custom locations for failing / completing courses.
  # If configured, teleporting back to joinLocation is replaced by these locations.
  # This is especially helpful for walk-in entry points so the player doesn't walk right back into the portal!
  # Format: "world,x,y,z,yaw,pitch" or null
  fail-location: null
  complete-location: null
  exit-location: null

  # When true, if a player is teleported away by another plugin, command, or mechanic (e.g. /home, /spawn, /tpa, chorus fruit),
  # their active parkour session is cleanly ended automatically.
  teleport-leaves-session: true
  cancel-on-external-teleport: true

# ─── Protections (Survival Safety) ───────────────────────────────────────────
# Crucial for SMP, Skyblock, and Factions so players do not die, lose items, or grief courses.
protections:
  # Prevents knockback on players during parkour (attacks, projectiles, explosions, wind charges, etc.).
  prevent-knockback: true

  # Prevents all damage (PvP, mobs, fall damage, fire, lava, drowning, suffocation, lightning) while doing parkour.
  # Handled safely via events (EntityDamageEvent) rather than the invulnerability tag so game mechanics remain responsive.
  prevent-damage: true

  # Prevents fall damage specifically while in an active parkour session.
  # If omitted or not explicitly configured, falls back to the value of prevent-damage above.
  prevent-fall-damage: true

  # When true, taking fall damage (e.g. falling off a high jump onto the ground)
  # instantly fails and respawns the player at their last checkpoint (with 0 damage taken if prevent-damage is true).
  fall-damage-fails-session: true

  # Prevents players from attacking mobs or other players during a session.
  prevent-pvp: true

  # Prevents hunger depletion so players can always sprint freely.
  prevent-hunger: true

  # Prevents breaking blocks during parkour.
  prevent-block-break: true

  # Prevents placing blocks (e.g. placing dirt/blocks to cheat jumps or water buckets).
  prevent-block-place: true

  # Prevents accidentally dropping items from the inventory while playing parkour.
  prevent-item-drop: true

  # Prevents picking up dropped items from the ground while in a session.
  prevent-item-pickup: true

# ─── Restrictions & Anti-Cheat ────────────────────────────────────────────────
restrictions:
  # Disables flying (/fly, creative flight, Essentials fly) during parkour.
  disable-flight: true

  # Disables Elytra gliding to prevent gliding straight to checkpoints or finish.
  disable-elytra: true

  # Disables launching projectiles (ender pearls, bows, tridents, etc.) during parkour.
  disable-projectile-launch: true

  # Prevents throwing Ender Pearls or eating Chorus Fruit during parkour.
  disable-ender-pearls: true

  # Disables the spear Lunge enchantment boost during parkour.
  disable-lunge: true

  # Disables trident Riptide launches during parkour (the riptide event is cancelled).
  # Normal trident throws are controlled by disable-projectile-launch above.
  disable-riptide: true

  # Disables potion effects during parkour: effects are removed when a run starts and cannot be gained
  # later (potions, beacons, conduits, food, commands...). Effects listed in the whitelist below are kept
  # and may still be gained. Use effect names, e.g. NIGHT_VISION, WATER_BREATHING.
  disable-potion-effects: true
  potion-effect-whitelist:
    - NIGHT_VISION

  # Enforces a specific gamemode during parkour, restored automatically upon exit.
  # Options: NONE | ADVENTURE | SURVIVAL
  force-gamemode: NONE

  # Controls command usage while in a parkour session.
  commands:
    # Mode: WHITELIST | BLACKLIST | DISABLED
    #   WHITELIST - Only commands in the whitelist below are allowed.
    #   BLACKLIST - All commands are allowed EXCEPT commands in the blacklist.
    #   DISABLED  - No command restrictions.
    mode: WHITELIST

    # Commands allowed when mode is WHITELIST (do not include leading slash):
    whitelist:
      - basicparkour
      - pk
      - parkour
      - cp
      - msg
      - tell
      - w
      - r

    # Commands blocked when mode is BLACKLIST:
    blacklist:
      - home
      - sethome
      - tp
      - tpa
      - tpahere
      - spawn
      - warp
      - fly
      - god
      - back

# ─── Hotbar Utility Items ─────────────────────────────────────────────────────
# Hotbar utility items given to players during parkour (Restart, Checkpoint, Visibility, Leave).
# By default disabled for SMP/Survival so players keep their normal items.
# Enable this for dedicated parkour servers!
hotbar-items:
  enabled: false

  # When true, player inventories (contents, armor, offhand) are safely saved before giving
  # hotbar items, and restored when leaving, completing, or failing parkour.
  save-inventory: true

  items:
    restart:
      slot: 0
      material: REPEATER
      custom_name: "<yellow><b>Restart Course</b></yellow>"
      lore:
        - "<gray>Right-click to restart from the beginning</gray>"
    checkpoint:
      slot: 1
      material: ARROW
      custom_name: "<green><b>Last Checkpoint</b></green>"
      lore:
        - "<gray>Right-click to return to your last checkpoint</gray>"
    visibility:
      slot: 7
      material: EYE_OF_ENDER
      custom_name: "<aqua><b>Toggle Visibility</b></aqua>"
      lore:
        - "<gray>Right-click to cycle player visibility (All / Ghosts / Hidden)</gray>"
    leave:
      slot: 8
      material: RED_BED
      custom_name: "<red><b>Leave Course</b></red>"
      lore:
        - "<gray>Right-click to exit parkour</gray>"

# ─── TAB Plugin Integration ───────────────────────────────────────────────────
tab:
  # Whether to hook into NEZNAMY's TAB plugin when installed.
  enabled: true
  # Disable player-to-player collision during parkour via TAB NameTagManager.
  disable-collision: true
  # Whether to hide player nametags while in a parkour session.
  hide-nametag: false
  # Pause TAB team handling during parkour.
  # FALSE: Recommended for SMP so player rank prefixes and tags remain visible.
  # TRUE: Recommended for dedicated parkour servers using translucent ghost teams.
  pause-team-handling: false

# ─── Ghost system ─────────────────────────────────────────────────────────────
ghost:
  # Whether the ghost recording system is enabled.
  # For SMP/Skyblock with a simple spawn parkour, set to false for maximum performance.
  # For dedicated parkour servers, set to true to record player runs.
  enabled: false
  # How often to capture a position frame (milliseconds). 50ms = 20fps.
  record-interval-ms: 50
  # Maximum number of frames to store per recording.
  # 12000 frames at 50ms = 600 seconds = 10 minutes max recording length.
  max-frames: 12000
  playback:
    # Whether to spawn replay ghosts during runs.
    enabled: false
    # Mode: SERVER_BEST | PERSONAL_BEST
    mode: SERVER_BEST
    # Whether the replay ghost is rendered as a translucent entity on the parkour team.
    translucent: true

# ─── Player Display Names ─────────────────────────────────────────────────────
# How player names are shown wherever BasicParkour lists players: leaderboard holograms,
# course-info records, the /top command, and the leaderboard / course selector menus.
player-display:
  # MiniMessage format. Tags:
  #   <player>  -> the player's plain name
  #   <uuid>    -> the player's UUID
  #   plus ANY MiniPlaceholders tag, e.g. <luckperms_prefix>, <scchatuser_displayname>
  # Examples:
  #   "<player>"                                  (default, plain name)
  #   "<scchatuser_displayname>"                  (SCChat display name)
  #   "<red><luckperms_prefix><player>"           (rank prefix + name)
  #
  # Online players resolve every MiniPlaceholders tag against the player.
  # Offline players have no audience, so only global placeholders resolve and any other
  # placeholder tag is dropped, EXCEPT <scchatuser_displayname>: it is fetched asynchronously
  # from SCChat (with its LuckPerms data), so it works for offline players too.
  format: "<player>"

  # Results are cached per player for this many seconds (0 = no cache).
  cache-seconds: 30

# ─── Hologram System ──────────────────────────────────────────────────────────
hologram:
  # Whether the hologram system is enabled.
  enabled: true

  # Preferred provider. Options: auto | FancyHolograms | DecentHolograms
  provider: auto

  # ── Update & Refresh Settings ───────────────────────────────────────────────
  # Configure how often and when holograms refresh their displayed data.
  update:
    # How often (in seconds) to periodically refresh all active holograms.
    # Set to 0 or -1 to disable periodic automatic background refresh.
    # (Backward-compatible alias: refresh-interval-seconds)
    interval-seconds: 60

    # Whether to automatically update linked course holograms when a player sets a new personal or course record.
    on-record: true

    # Whether to automatically update linked course holograms whenever any player finishes a course.
    on-completion: false

  # Default number of entries to show on a leaderboard hologram if not specified during creation.
  default-limit: 10

  # ── Text Display Properties ─────────────────────────────────────────────────
  # Look of the hologram's text display entity. Applies to FancyHolograms only
  # (DecentHolograms uses armor stands and ignores these). Every key is optional;
  # omitted keys keep the provider's default. Applied to all holograms, and each
  # hologram can override any key with its own 'display:' section (in holograms.yml
  # or in a static definition below).
  display:
    # How the text rotates to face players: CENTER (always faces the player),
    # VERTICAL (rotates around Y only), HORIZONTAL (tilts only), FIXED (uses yaw/pitch)
    billboard: CENTER
    # Text alignment inside the display: CENTER | LEFT | RIGHT
    alignment: CENTER
    # Background: default (vanilla translucent black) | transparent | "#RRGGBB" | "#AARRGGBB"
    background: default
    # Draw a drop shadow behind the text
    text-shadow: false
    # Let the text be seen through blocks
    see-through: false
    # Size multiplier (1.0 = normal)
    scale: 1.0
    # Fixed light level 0-15; uncomment both to make the text fullbright regardless of surroundings
    # brightness:
    #   block: 15
    #   sky: 15
    # Entity shadow on the ground (0 disables)
    # shadow-radius: 0.0
    # shadow-strength: 1.0

  # ── Leaderboard Hologram Format ──────────────────────────────────────────────
  # Formatting for 'leaderboard' type holograms.
  # Available placeholders in header/empty/footer:
  #   {course}       -> Course display name (MiniMessage formatted)
  #   {course_name}  -> Course plain-text display name
  #   {course_id}    -> Course identifier
  #   {limit}        -> Maximum number of entries displayed
  #   {count}        -> Number of entries currently on the leaderboard
  #   {template_id}  -> Endless/generator template ID (if applicable)
  #   {command}      -> Recommended play command (/basicparkour join <id> or endless <id>)
  leaderboard:
    # Header lines displayed at the top of the hologram.
    header:
      - "<gold>━━━ <bold>{course}</bold> Top {limit} ━━━</gold>"

    # Format for each leaderboard entry on standard (time-based) courses.
    # Available placeholders:
    #   {rank}      -> 1-based leaderboard position
    #   {player}    -> Player display name
    #   {time}      -> Formatted completion time (e.g. 01:23.456)
    #   {time_ms}   -> Completion time in milliseconds
    #   {uuid}      -> Player UUID
    entry-format: "<yellow>#{rank} </yellow><white>{player}</white> <gray>—</gray> <aqua>{time}</aqua>"

    # Format for each leaderboard entry on endless / generated courses (ranked by blocks cleared).
    # Available placeholders:
    #   {rank}      -> 1-based leaderboard position
    #   {player}    -> Player display name
    #   {blocks}    -> Number of blocks cleared
    #   {time}      -> Elapsed time formatted
    #   {time_ms}   -> Elapsed time in milliseconds
    #   {uuid}      -> Player UUID
    entry-format-blocks: "<yellow>#{rank} </yellow><white>{player}</white> <gray>—</gray> <green>{blocks} blocks</green> <dark_gray>({time})</dark_gray>"

    # Line displayed when the course has no records yet.
    empty: "<gray>No records yet. Be the first!</gray>"

    # Footer lines displayed at the bottom for standard courses.
    footer:
      - "<gray>Race now: <white>/basicparkour join {course_id}</white></gray>"

    # Footer lines displayed at the bottom for endless / generated courses.
    footer-endless:
      - "<gray>Play now: <white>/basicparkour endless {template_id}</white></gray>"

    # Optional full layout override:
    # If set, the hologram follows this exact list of lines.
    # Use {entries} to insert the leaderboard entry lines at that position.
    # lines:
    #   - "<gold>━━━ <bold>{course}</bold> Top {limit} ━━━</gold>"
    #   - "{entries}"
    #   - "<gray>Race now: <white>{command}</white></gray>"

  # ── Course Info Hologram Format ─────────────────────────────────────────────
  # Formatting for 'course_info' type holograms.
  # Available placeholders in header/checkpoints/record/footer:
  #   {course}       -> Course display name (MiniMessage formatted)
  #   {course_name}  -> Course plain-text display name
  #   {course_id}    -> Course identifier
  #   {checkpoints}  -> Total number of checkpoints in the course
  #   {player}       -> Record holder's name
  #   {time}         -> Record completion time formatted
  #   {time_ms}      -> Record completion time in milliseconds
  #   {blocks}       -> Record blocks cleared (for endless courses)
  #   {template_id}  -> Endless/generator template ID (if applicable)
  #   {command}      -> Recommended play command
  course-info:
    # Header lines displayed at the top.
    header:
      - "<gradient:#ff9a9e:#fecfef><bold>{course}</bold></gradient>"

    # Checkpoint count display line (shown for standard courses with checkpoints).
    checkpoints: "<gray>Checkpoints: <white>{checkpoints}</white></gray>"

    # Record display when a standard time record exists.
    record: "<gray>Record: <aqua>{time}</aqua> by <white>{player}</white></gray>"

    # Record display when an endless block record exists.
    record-blocks: "<gray>Record: <green>{blocks} blocks</green> <dark_gray>({time})</dark_gray> by <white>{player}</white></gray>"

    # Record display when no record has been set yet.
    record-none: "<gray>Record: <white>None</white></gray>"

    # Footer lines displayed at the bottom for standard courses.
    footer:
      - "<green>Type <white>/basicparkour join {course_id}</white> to play!</green>"

    # Footer lines displayed at the bottom for endless courses.
    footer-endless:
      - "<green>Type <white>/basicparkour endless {template_id}</white> to play!</green>"

    # Optional full layout override:
    # lines:
    #   - "<gradient:#ff9a9e:#fecfef><bold>{course}</bold></gradient>"
    #   - "{checkpoints}"
    #   - "{record}"
    #   - "{footer}"

  # ── Static Hologram Definitions (Optional) ──────────────────────────────────
  # Declare static holograms directly in config.yml.
  # These are loaded alongside in-game holograms saved in holograms.yml.
  # definitions:
  #   spawn_leaderboard:
  #     type: LEADERBOARD
  #     course: easy_1
  #     limit: 10
  #     world: world
  #     x: 100.5
  #     y: 65.0
  #     z: 200.5
  #     yaw: 0.0
  #     pitch: 0.0
  #     # Optional per-hologram override of the 'display' defaults above:
  #     # display:
  #     #   billboard: VERTICAL
  #     #   background: transparent
  #     #   scale: 1.5
  #     # Optional custom lines override:
  #     # lines:
  #     #   - "<gold>Custom Leaderboard</gold>"
  #     #   - "{entries}"

# ─── NPC System ───────────────────────────────────────────────────────────────
npc:
  # Automatically update linked TOP_HOLDER NPC skins and names on new records.
  auto-update-top-holder: true

# ─── Timer ────────────────────────────────────────────────────────────────────
timer:
  # How often to update the action bar timer (in ticks, 1 = every tick).
  display-interval-ticks: 1

# ─── Commands ─────────────────────────────────────────────────────────────────
# All command literals and permission nodes are fully customisable here.
# Changes take effect after a server restart (commands are registered at boot).
commands:
  # Root command literal that players type (e.g. /basicparkour).
  root: basicparkour
  # Additional aliases for the root command.
  aliases:
    - pk
    - parkour
  # Permission nodes checked at command execution time.
  permissions:
    # Required for join / leave / restart / checkpoint / top / pb sub-commands.
    use: basicparkour.use
    # Required for reload / resetpb sub-commands.
    admin: basicparkour.admin
    # Per-course / per-endless-template access. {id} is the lower-cased course id or template id.
    # Players only see (tab-complete, menus) and can only start what they have access to; admins can use all.
    # Examples: deny "basicparkour.endless.medium" to keep a group on easy only, or set default-access to
    # false and grant "basicparkour.endless.easy" / "basicparkour.course.spawn" to whitelist.
    # Generated runs (generated_N) are never listed or joinable by name.
    course: "basicparkour.course.{id}"
    endless: "basicparkour.endless.{id}"
    # What applies when a permission plugin has not set the node above for a player.
    default-access: true
  # Sub-command literal names (rename any of these freely).
  subcommands:
    menu: menu
    ghost: ghost
    join: join
    leave: leave
    restart: restart
    checkpoint: checkpoint
    pos1: pos1
    pos2: pos2
    endless: endless
    top: top
    pb: pb
    reload: reload
    resetpb: resetpb
    generate: generate
    setentry: setentry
    removeentry: removeentry
    wand: wand
    create: create
    setstart: setstart
    setend: setend
    setportal: setportal
    addcp: addcp
    save: save

# ─── Editor ───────────────────────────────────────────────────────────────────
# In-game parkour course builder & selection wand configuration.
editor:
  wand:
    material: BLAZE_ROD
    custom_name: "<gradient:#ff9a9e:#fecfef><b>Parkour Selection Wand</b></gradient>"
    lore:
      - "<gray>Left-click block: <yellow>Set Position 1</yellow></gray>"
      - "<gray>Right-click block: <yellow>Set Position 2</yellow></gray>"
      - ""
      - "<yellow>Use /basicparkour setstart, setend, addcp to build!</yellow>"
    enchantment_glint_override: true

# ─── Generator ────────────────────────────────────────────────────────────────
# Controls the dynamic parkour generator system.
generator:
  # The leaderboard course ID shared by all generated runs.
  leaderboard-id: "__generated__"

  # How many seconds to wait after a generated session ends before removing blocks.
  default-cleanup-delay-seconds: 30

  # Extra clearance (blocks) added between allocated dedicated-world slots.
  dedicated-world-padding: 64

  # Y level at which generated runs are anchored in dedicated-world mode.
  dedicated-world-y: 80

  # Minimum distance (blocks, all three axes) a new platform keeps from other players' runs in the same world.
  # Parkour blocks are real server blocks hidden per player, so overlapping runs would still collide with each
  # other. Best effort (a platform is re-rolled up to 20 times); 0 disables.
  run-separation: 5

  # Sound played when player increases block count in endless parkour
  block-sound:
    enabled: true
    sound: "block.note_block.bass"
    volume: 0.8
    # Shepard tone effect creates an auditory illusion of an infinitely ascending scale with no ceiling
    shepard: true
    # Steps per octave cycle (12 semitones = full musical octave)
    shepard-cycle: 12
    # Static pitch fallback used only if shepard is disabled
    pitch: 1.0

  # Optional chat message sent when block count increases (empty by default so only the sound plays)
  # Placeholders available: <blocks>, <score>, <gained>
  block-message: ""

  # Walk-in / spawn grace: seconds a player may stay on the START platform of an endless run
  # (for walk-in entries this is the non-parkour entry area). The effective limit is the larger of this
  # and the difficulty's sliding-window-time-seconds. When it runs out the player fails (walk-in)
  # or the start platform vanishes (teleported entries). Only applies to sliding-window-mode TIME / DUAL.
  start-grace-seconds: 6.0

  # Default difficulty parameters (used unless overridden in the template YAML).
  # sliding-window-time-seconds = how long a player may stand on a platform (counted from the moment they
  # land on it) before it vanishes under them. Lower = faster tempo.
  # Note: In vanilla Minecraft:
  # - +1 jump: capped at horizontal center distance 4.0 (3 air blocks) in a straight line.
  # - Flat jump: capped at horizontal center distance 5.0 (4 air blocks - classic 4b jump).
  # - Downward jumps (-1 to -3): increased air time allows center distances up to 5.4 - 6.2 blocks.
  # - Turning angles reduce sprint momentum and are coupled to jump distance to guarantee jumpability.
  difficulties:
    EASY:
      min-gap: 2
      max-gap: 3
      min-height-delta: -1
      max-height-delta: 0
      platform-min-size: 2
      platform-max-size: 3
      max-turn-angle: 20.0
      sliding-window-ahead: 6
      sliding-window-time-seconds: 3.0
      obstacle-chance: 0.0
      modifier-chance: 0.0
    MEDIUM:
      min-gap: 2
      max-gap: 4
      min-height-delta: -1
      max-height-delta: 1
      platform-min-size: 1
      platform-max-size: 2
      max-turn-angle: 35.0
      sliding-window-ahead: 5
      sliding-window-time-seconds: 2.0
      obstacle-chance: 0.10
      modifier-chance: 0.05
    HARD:
      min-gap: 3
      max-gap: 5
      min-height-delta: -2
      max-height-delta: 1
      platform-min-size: 1
      platform-max-size: 1
      max-turn-angle: 55.0
      sliding-window-ahead: 4
      sliding-window-time-seconds: 1.1
      obstacle-chance: 0.25
      modifier-chance: 0.12
    EXPERT:
      min-gap: 3
      max-gap: 5
      min-height-delta: -3
      max-height-delta: 1
      platform-min-size: 1
      platform-max-size: 1
      max-turn-angle: 80.0
      sliding-window-ahead: 3
      sliding-window-time-seconds: 0.7
      obstacle-chance: 0.35
      modifier-chance: 0.20

  # Entry points registered via /basicparkour setentry <templateId> [portal|interact] [optional_yaw].
  #
  # ── SETUP FLOW 1: Walk-In Area (Starts where you are, no teleport) ──
  # 1. Set template 'entry-mode: WALK_IN' in generators/<template>.yml.
  # 2. Select the area using /bp pos1 and /bp pos2.
  # 3. Type: /bp setentry <templateId> portal [optional_yaw]
  #    Example: /bp setentry example_generated portal 180 (forces course to head North)
  #    Or omit yaw to dynamically follow the player's walking direction!
  #
  # ── SETUP FLOW 2: Walk-In Area (Teleports to dedicated world / separate location) ──
  # 1. Set template 'entry-mode: DEDICATED_WORLD' in generators/<template>.yml.
  # 2. Select the portal area using /bp pos1 and /bp pos2.
  # 3. Type: /bp setentry <templateId> portal
  #    When a player walks in, they teleport to a private slot in the dedicated world!
  #
  # ── SETUP FLOW 3: Interactable Block (Starts where you are OR teleports) ──
  # 1. Look at a sign, button, pressure plate, or block.
  # 2. Type: /bp setentry <templateId> interact
  #    (If template is WALK_IN, blocks spawn in front of player; if DEDICATED_WORLD, teleports).
  #    Alternatively, place a Sign with line 0 = [BasicParkour] and line 1 = <templateId>!
  entry-points: {}
