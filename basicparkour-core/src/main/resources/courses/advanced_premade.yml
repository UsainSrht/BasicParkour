# ─────────────────────────────────────────────────────────────────────────────
# Basic Parkour Course Definition — Advanced Premade
# ─────────────────────────────────────────────────────────────────────────────

id: advanced_premade
display-name: "<gradient:red:dark_red><bold>Hardcore Course</bold></gradient>"
world: world

start-region:
  min: { x: 1000.0, y: 100.0, z: 1000.0 }
  max: { x: 1004.0, y: 104.0, z: 1004.0 }

end-region:
  min: { x: 1050.0, y: 100.0, z: 1000.0 }
  max: { x: 1054.0, y: 104.0, z: 1004.0 }

portal-region:
  min: { x: 0.0, y: 64.0, z: 0.0 }
  max: { x: 2.0, y: 66.0, z: 2.0 }
teleport-from-portal: true

start-locations:
  - x: 1002.0
    y: 101.0
    z: 1002.0
    yaw: 90.0
    pitch: 0.0

checkpoints:
  - location: { x: 1025.0, y: 101.0, z: 1002.0, yaw: 90.0, pitch: 0.0 }
    region:
      min: { x: 1023.0, y: 100.0, z: 1000.0 }
      max: { x: 1027.0, y: 104.0, z: 1004.0 }

# Only allow stepping on IRON_BLOCK and GOLD_BLOCK
block-list:
  mode: WHITELIST
  materials:
    - IRON_BLOCK
    - GOLD_BLOCK
    - LIGHT_WEIGHTED_PRESSURE_PLATE # Checkpoint triggers usually need this

# Falling below y=90 instantly fails
min-y: 90

# If you fail, you don't restart at the checkpoint. You go back to spawn!
die-mode: FAIL_DIE
