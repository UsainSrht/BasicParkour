# ──────────────────────────────────────────────────────────────────────────────
# BasicParkour — Single Block Endless (Hard Preset)
# ──────────────────────────────────────────────────────────────────────────────
# Technical single block parkour demanding momentum preservation.
# Features true 4-block flat jumps, sharp turns, zig-zags, +1 climbs, and a 1.1s per-platform standing timer.

id: "single_block_hard"
display-name: "<gradient:#ff9966:#ff5e62>Single Block — Hard</gradient>"

difficulty: HARD

theme:
  name: "BasicPlanks"
  platform-materials:
    - OAK_PLANKS
    - STRIPPED_OAK_LOG
    - BIRCH_PLANKS
    - STRIPPED_BIRCH_LOG
    - SPRUCE_PLANKS
    - STRIPPED_SPRUCE_LOG
  obstacle-materials: []

length-type: INFINITE
fixed-length: 30

block-mode: SLIDING_WINDOW
sliding-window-ahead: 4
sliding-window-mode: DUAL
sliding-window-time-seconds: 1.1   # seconds a player may stand on a platform (counted from landing) before it vanishes

appear-animation: GROW
die-mode: FAIL_DIE

prevent-damage: true
fall-damage-fails-session: true
cleanup-delay-seconds: 0

entry-mode: WALK_IN
dedicated-world: "world"
dedicated-world-radius: 20000

shared: false
leaderboard-course-id: "single_block_hard"

platform-shapes:
  - "1x1"

direction-cone: 90.0
corridor-width: 0
max-height-deviation: 15
