# ──────────────────────────────────────────────────────────────────────────────
# BasicParkour — Single Block Endless Generator Template
# ──────────────────────────────────────────────────────────────────────────────
# In this parkour, ONLY single (1x1) blocks are generated for every jump.
# Obstacles are never placed on landing blocks, and all jumps strictly respect
# vanilla Minecraft jump physics (never impossible).

id: "single_block"
display-name: "<gradient:gold:yellow>Single Block Parkour</gradient>"

difficulty: MEDIUM

theme:
  name: "Planks"
  platform-materials:
    - OAK_PLANKS
    - BIRCH_PLANKS
    - SPRUCE_PLANKS
    - DARK_OAK_PLANKS
  accent-materials:
    - STRIPPED_OAK_LOG
  obstacle-materials: []

length-type: INFINITE
fixed-length: 30

block-mode: SLIDING_WINDOW
sliding-window-ahead: 4
sliding-window-mode: DUAL
sliding-window-time-seconds: 12.0

appear-animation: GROW
die-mode: FAIL_DIE

# ── Damage Protections ────────────────────────────────────────────────────────
# Whether players doing this parkour can take damage (handled via events).
# When true, all damage is completely prevented.
# If omitted, defaults to global config (protections.prevent-damage).
prevent-damage: true

# When true, taking fall damage instantly fails the session (with 0 damage taken).
# If omitted, defaults to global config (protections.fall-damage-fails-session).
fall-damage-fails-session: true

cleanup-delay-seconds: 0

entry-mode: WALK_IN
dedicated-world: "world"
dedicated-world-radius: 20000

shared: false

leaderboard-course-id: "single_block"

# Pure 1x1 single blocks only
platform-shapes:
  - "1x1"

# ── Direction & Cone Constraint ───────────────────────────────────────────────
# Restricts the allowed heading angle of generated jumps, projecting a forward cone.
# Prevents endless parkour from looping backwards and overlapping with its own tail!
# Options:
#   90.0  - 90° forward cone (±45° from start direction). Ideal for infinite forward runs!
#   180.0 - 180° forward hemisphere (±90°, forward and sideways only, never backwards).
#   360.0 - Full 360° freedom (can turn in any direction).
#   0.0   - Strictly straight line.
direction-cone: 90.0

# Optional corridor width (in blocks) to keep endless parkour within a central lane.
# Set to 0 to disable (pure cone projection).
corridor-width: 0

# Optional maximum vertical height deviation (in blocks) from start location.
# Prevents endless runs from endlessly climbing to the sky or diving into the void.
max-height-deviation: 15

difficulty-overrides:
  min-gap: 2
  max-gap: 4
  min-height-delta: -1
  max-height-delta: 1
  obstacle-chance: 0.0
