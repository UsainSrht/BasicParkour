# ──────────────────────────────────────────────────────────────────────────────
# BasicParkour — Example Generator Template
# ──────────────────────────────────────────────────────────────────────────────
# This file defines a single generator template. Copy and rename it to create
# additional templates (e.g. nether_hard.yml, ocean_easy.yml).
#
# REQUIRED fields are marked with [REQ].
# OPTIONAL fields show their default value in a comment.

# ── Identity ──────────────────────────────────────────────────────────────────
id: "example_generated"            # [REQ] Unique template ID (used in commands)
display-name: "<gradient:aqua:blue>Generated Parkour</gradient>"

# ── Difficulty ────────────────────────────────────────────────────────────────
# Options: EASY | MEDIUM | HARD | EXPERT
# Each difficulty has built-in gap/height defaults — override them below if needed.
difficulty: MEDIUM

# ── Theme (block palettes) ────────────────────────────────────────────────────
theme:
  name: "Forest"
  platform-materials:
    - OAK_PLANKS
    - BIRCH_PLANKS
    - JUNGLE_PLANKS
  accent-materials:
    - MOSSY_COBBLESTONE
    - COBBLESTONE
  obstacle-materials:
    - OAK_SLAB
    - OAK_TRAPDOOR

# ── Length ────────────────────────────────────────────────────────────────────
# Options: FIXED | INFINITE
# INFINITE = the course never ends; new platforms are generated as the player advances.
length-type: INFINITE
fixed-length: 30          # Number of platforms (only used when length-type is FIXED)

# ── Block mode ────────────────────────────────────────────────────────────────
# FULL_UPFRONT  — Place all blocks before the run starts, remove all on end.
# SLIDING_WINDOW — Generate ahead, remove behind as the player moves (use this for INFINITE).
block-mode: SLIDING_WINDOW
sliding-window-ahead: 15  # How many platforms to keep visible ahead (SLIDING_WINDOW only)

# ── Sliding Window Mode (dual mode: block-dependent and time-dependent) ───────
# Options: BLOCKS | TIME | DUAL
#   BLOCKS - Platforms behind player are removed based strictly on platform distance ahead.
#   TIME   - Platforms behind player (or stepped on) are removed after X seconds.
#   DUAL   - Platforms are removed if either distance threshold is exceeded OR time expires!
sliding-window-mode: DUAL
sliding-window-time-seconds: 15.0 # Lifespan in seconds for platforms under TIME or DUAL mode

# ── Block Appear Animation ────────────────────────────────────────────────────
# Defines the animation used when new blocks dynamically appear in endless parkours.
# Options:
#   NONE    - Block gets placed directly with no entity or delay.
#   DEFAULT - Block display entity is spawned at previous platform and smoothly glides to its place.
#   GROW    - Block display entity spawns at final location, smoothly scales from 0 to 1, then turns into solid block.
appear-animation: DEFAULT

# ── Failure & Die Mode ────────────────────────────────────────────────────────
# Controls what happens when a player falls or fails during an endless parkour run.
# Options:
#   FAIL_DIE    - Falling ends the run, saves personal best score, and teleports player to fail/exit location.
#   RESTART_DIE - Falling teleports player to their last reached checkpoint so they can keep going!
die-mode: FAIL_DIE

# Optional custom location to teleport player when they fail or leave this endless run.
# Helpful for WALK_IN entry points to send players to a lobby/spawn spot instead of inside the portal.
# Format: "world,x,y,z,yaw,pitch"
# fail-location: "world,100.5,64.0,200.5,90.0,0.0"

# ── Cleanup ───────────────────────────────────────────────────────────────────
# How many seconds to wait after the session ends before removing placed blocks.
cleanup-delay-seconds: 30

# ── Entry mode ────────────────────────────────────────────────────────────────
# WALK_IN         — Starts directly in front of the player without teleporting them away.
#                   Set up an entry portal area at your spawn (via /bp setentry <id> portal).
#                   When a player walks into the area, the first platform spawns directly in front
#                   of them along their heading and they seamlessly continue jumping forward!
# DEDICATED_WORLD — Placed at a random non-overlapping slot in a dedicated or separate world.
#                   The player is teleported to the slot origin to start.
# MARKER          — Placed at an admin-defined fixed marker (use /bp setentry <id> interact).
entry-mode: WALK_IN
dedicated-world: "world"      # Name of the world to generate in (for DEDICATED_WORLD)
dedicated-world-radius: 20000 # Max distance from 0,0 for slot placement (for DEDICATED_WORLD)

# Optional fixed direction (yaw) in degrees for walk-in entry (e.g. 0 = South, 90 = West, 180 = North, 270 = East).
# If omitted or commented out, the player's real-time walking direction (yaw) will be used dynamically!
# walk-in-yaw: 180.0

# ── Session sharing ───────────────────────────────────────────────────────────
# false = each player gets their own private instance (solo)
# true  = multiple players can join the same generated instance simultaneously
shared: false

# ── Seed ─────────────────────────────────────────────────────────────────────
# Remove this line (or set to ~) for a random seed every run.
# Set a number to always generate the same layout.
# seed: 123456789

# ── Leaderboard ───────────────────────────────────────────────────────────────
# All generated runs are tracked under this shared course ID for leaderboards.
# Override here to have a separate board for this template.
leaderboard-course-id: "__generated__"

# ── Platform shapes ─────────────────────────────────────────────────────────
# Defines which platform designs are generated for each jump.
# Available shapes:
#   - "1x1"   : Single block jump (pure parkour; obstacles are NEVER placed on 1x1 landing blocks)
#   - "2x2"   : 2x2 block square
#   - "3x3"   : 3x3 platform
#   - "2x1"   : 2-block line
#   - "3x1"   : 3-block runway
#   - "CROSS" : Plus/cross shape (5 blocks)
#
# For a pure 1-block parkour, simply specify only "1x1":
#   platform-shapes:
#     - "1x1"
#
# Combinations can be configured freely:
platform-shapes:
  - "1x1"
  - "2x2"
  - "CROSS"

# ── Direction & Cone Constraint ───────────────────────────────────────────────
# Restricts the allowed heading angle of generated jumps, projecting a forward cone.
# Prevents endless parkour from looping backwards and overlapping with its own tail!
# Options:
#   90.0  - 90° forward cone (±45° from start direction). Ideal for forward endless runs!
#   180.0 - 180° forward hemisphere (±90°, forward and sideways only, never backwards).
#   360.0 - Full 360° freedom (can turn in any direction; self-overlap avoidance prevents collisions).
#   0.0   - Strictly straight line forward.
direction-cone: 90.0

# Optional fixed direction (yaw) in degrees for the cone projection.
# If omitted or commented out, dynamically follows the start heading (walk-in yaw or marker yaw).
# direction-yaw: 0.0

# Optional corridor width (in blocks) to keep the endless parkour centered along
# the forward axis. Set to 0 to disable and allow free cone expansion.
corridor-width: 0

# Optional maximum vertical height deviation (in blocks) from the start location.
# Prevents endless runs from endlessly climbing to the sky or diving into the void.
# Set to 0 to disable.
max-height-deviation: 15

# ── Difficulty overrides (optional) ──────────────────────────────────────────
# Vanilla Minecraft physics note:
# Maximum vanilla jump height without potion effects is 1.25 blocks (+1 block elevation).
# Jumping up +1 block caps horizontal distance at 3.0 blocks.
# Flat jumps cap at 4.0 blocks. Downward jumps cap at 4.2 blocks.
# difficulty-overrides:
#   min-gap: 2
#   max-gap: 4
#   min-height-delta: -2
#   max-height-delta: 1
#   obstacle-chance: 0.15   # probability 0.0 – 1.0 (never placed on 1x1 landing blocks)
#   modifier-chance: 0.05   # probability 0.0 – 1.0

# ── Modifier overrides (optional) ────────────────────────────────────────────
# Maps specific block materials to built-in modifier behaviours.
# Uncomment and adjust as needed.
# modifiers:
#   - block: SLIME_BLOCK
#     type: jump_pad
#   - block: HONEY_BLOCK
#     type: boost
#   - block: MAGMA_BLOCK
#     type: kill_block

